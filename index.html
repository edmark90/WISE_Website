<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WISE SYSTEM — Admin Login</title>
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
 
<div class="login-card">
  <!-- Left Panel - Branding & Illustration -->
  <div class="left-panel">
    <div class="branding-header">
      <img src="assets/images/wise-logo-clean.png" alt="WISE Smart Waste Management Logo" class="wise-logo">
      <div class="tagline-group">
        <h2 class="tagline-title">AI-Powered. Community Driven.</h2>
        <p class="tagline-sub">Building a cleaner Muntinlupa.</p>
      </div>
    </div>
    
    <div class="illustration-container">
      <img src="assets/images/login-bg-faded.png" alt="Muntinlupa Smart Waste Management" class="illustration-img">
    </div>
  </div>

  <!-- Right Panel - Login Form -->
  <div class="right-panel">
    <div class="form-wrapper">
    
   
      <h1 class="welcome-heading">WELCOME BACK!</h1>
      <p class="welcome-sub">Sign in to continue to your account</p>
   
      <form id="login-form">
        <div class="form-group">
          <label for="admin-id" class="input-label">Email</label>
          <div class="input-container">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            <input id="admin-id" type="email" placeholder="Admin@gmail.com" value="Admin@gmail.com" required>
          </div>
        </div>
   
        <div class="form-group">
          <div class="label-row">
            <label for="password" class="input-label">Secure Password</label>
            <a href="#" class="forgot-link">Forgot Password?</a>
          </div>
          <div class="input-container">
            <svg class="field-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <input id="password" type="password" placeholder="••••••••" required>
            <button type="button" class="eye-toggle-btn" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>
   
        <label class="remember-row">
          <input type="checkbox" id="remember-me">
          <span>Remember me on this device</span>
        </label>
   
        <button type="submit" class="login-btn">
          <span>Login to System</span>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="btn-arrow">
            <line x1="5" y1="12" x2="19" y2="12"></line>
            <polyline points="12 5 19 12 12 19"></polyline>
          </svg>
        </button>
      </form>
    </div>
  </div>
</div>
 
<!-- Shared core modules -->
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<!-- Page entry point -->
<script src="assets/js/pages/login.js"></script>

</body>
</html>
