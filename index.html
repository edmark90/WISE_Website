<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WISE SYSTEM — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="icon" type="image/png" href="assets/images/logo wise.png">
</head>
<body>

<div class="login-card">
  <!-- Left Panel - Full-Bleed WISE Brand & Truck Scene -->
  <div class="left-panel">
    <img src="assets/images/login-hero-left.png" alt="WISE Smart Waste Management — For a Cleaner Muntinlupa" class="left-hero-img">
  </div>

  <!-- Right Panel - Clean Admin Login Form -->
  <div class="right-panel">
    <div class="form-wrapper">
      <div class="login-header">
        <h1 class="welcome-heading">Admin Login</h1>
        <span class="heading-underline"></span>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="admin-id" class="input-label">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="2" y="4" width="20" height="16" rx="3"></rect>
              <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"></path>
            </svg>
            <span>Email</span>
          </label>
          <div class="input-container">
            <input id="admin-id" type="email" placeholder="Admin@gmail.com" value="Admin@gmail.com" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="input-label">
            <svg class="label-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <span>Password</span>
          </label>
          <div class="input-container">
            <input id="password" type="password" placeholder="•••••••" required autocomplete="current-password">
            <button type="button" class="eye-toggle-btn" onclick="togglePassword()" aria-label="Toggle password visibility">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="remember-me">
          <span>Remember me</span>
        </label>

        <button type="submit" class="login-btn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" class="btn-signin-icon">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path>
            <polyline points="10 17 15 12 10 7"></polyline>
            <line x1="15" y1="12" x2="3" y2="12"></line>
          </svg>
          <span>Sign In</span>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Shared core modules -->
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<!-- Page entry point -->
<script src="assets/js/pages/login.js"></script>

</body>
</html>
