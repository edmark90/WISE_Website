
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WISE SYSTEM — Admin Login</title>
<link rel="stylesheet" href="assets/css/login.css">
</head>
<body>
 
<div class="card">
  <div class="icon">
    <svg viewBox="0 0 24 24" fill="none" stroke="#2563eb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="3" width="7" height="7"></rect>
      <rect x="14" y="3" width="7" height="7"></rect>
      <rect x="3" y="14" width="7" height="7"></rect>
      <rect x="14" y="14" width="7" height="7"></rect>
    </svg>
  </div>
 
  <h1>WISE SYSTEM</h1>
  <p class="subtitle">Sign in to Admin Dashboard</p>
 
  <form id="login-form">
    <div class="field">
      <label for="admin-id">Email</label>
      <div class="input-wrap">
        <svg class="left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <input id="admin-id" type="email" placeholder="Enter your email">
      </div>
    </div>
 
    <div class="field">
      <div class="field-row">
        <label for="password" style="margin-bottom:0;">Secure Password</label>
        <a href="#" class="forgot">Forgot Password?</a>
      </div>
      <div class="input-wrap">
        <svg class="left-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="11" width="18" height="11" rx="2"></rect>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
        </svg>
        <input id="password" type="password" placeholder="Enter your password">
        <button type="button" class="toggle-eye" onclick="togglePassword()">
          <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </button>
      </div>
    </div>
 
    <label class="remember">
      <input type="checkbox">
      Remember me on this device
    </label>
 
    <button type="submit" class="submit">
      Login to System
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </button>
  </form>
</div>
 
<!-- Shared core modules -->
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<!-- Page entry point -->
<script src="assets/js/pages/login.js"></script>

</body>
</html>
