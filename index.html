<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WISE SYSTEM — Admin Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/login.css">
<link rel="icon" type="image/png" href="assets/images/logo wise.png">
</head>
<body>

<div class="login-card">
  <!-- Left Panel - Full-Bleed WISE Brand & Truck Scene -->
  <div class="left-panel">
    <img src="assets/images/login-hero-left.png" alt="WISE Smart Waste Management — For a Cleaner Muntinlupa" class="left-hero-img">
  </div>

  <!-- Right Panel - Clean Admin Login Form -->
  <div class="right-panel">
    <div class="form-wrapper">
      <div class="mobile-brand-badge">
        <img src="assets/images/logo wise.png" alt="WISE Logo">
        <span>WISE SYSTEM</span>
      </div>
      <div class="login-header">
        <h1 class="welcome-heading">Admin Login</h1>
        <p class="login-subtitle">Sign in to WISE Muntinlupa</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label for="admin-id" class="input-label">Email</label>
          <div class="input-container">
            <input id="admin-id" type="email" placeholder="admin@wise.gov.ph" required autocomplete="email">
          </div>
        </div>

        <div class="form-group">
          <label for="password" class="input-label">Password</label>
          <div class="input-container">
            <input id="password" type="password" placeholder="Enter your password" required autocomplete="current-password">
            <button type="button" id="toggle-password-btn" class="eye-toggle-btn" onclick="togglePassword()" aria-label="Show password" aria-pressed="false">
              <svg id="eye-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <label class="remember-row">
          <input type="checkbox" id="remember-me">
          <span>Remember email</span>
        </label>

        <button type="submit" class="login-btn">
          <span>Sign In</span>
        </button>
      </form>
    </div>
  </div>
</div>

<!-- Shared core modules -->
<script src="assets/js/core/config.js"></script>
<script src="assets/js/core/dom.js"></script>
<!-- Page entry point -->
<script src="assets/js/pages/login.js"></script>

</body>
</html>
